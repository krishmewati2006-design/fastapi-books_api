name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy through SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids i-0b3e7b4f6aba63f6c \
            --parameters 'commands=["set -e","cd /home/ubuntu/fastapi-books_api","sudo -u ubuntu -H git pull","sudo -u ubuntu -H docker compose up -d --build"]' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id i-0b3e7b4f6aba63f6c || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-0b3e7b4f6aba63f6c --query "{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}" --output yaml
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-0b3e7b4f6aba63f6c --query Status --output text)
          test "$STATUS" = "Success"